[project]
name = "litmo"
version = "0.1.0"
description = "Shared plumbing for literate-analysis repositories: artifact sync and a common make interface"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Evan Morrison", email = "emorrison@gmail.com" }]
keywords = ["quarto", "reproducible-research", "data-sync", "s3", "r2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Archiving :: Mirroring",
  "Typing :: Typed",
]

# The core is stdlib-only on purpose: a repo whose inputs are published files
# behind a URL (the `fetch` kind, and reading a public mirror) should not have
# to carry boto3 into its lockfile. The heavier paths declare themselves.
dependencies = []

[project.optional-dependencies]
# Upper-bounded on purpose. This checkout's lock protects only this checkout;
# a consumer's first resolution reads these ranges, and both packages reach
# substantive APIs (client/get_object/download_file/upload_file/put_object,
# ZstdCompressor/stream_writer/ZstdDecompressor/stream_reader), so an
# incompatible major would break publishing or archive handling outright.
# Widen a bound after the new major has been through the suite.
# Writing to the bucket, and reading from a private one.
s3 = ["boto3>=1.34,<2"]
# The `archive` kind — tar.zst bundles for trees of many small files.
archive = ["zstandard>=0.22,<1"]
all = ["boto3>=1.34,<2", "zstandard>=0.22,<1"]

[project.urls]
Homepage = "https://github.com/evmo/litmo"
Source = "https://github.com/evmo/litmo"
Issues = "https://github.com/evmo/litmo/issues"
Changelog = "https://github.com/evmo/litmo/blob/main/CHANGELOG.md"

[project.scripts]
litmo = "litmo.cli:main"

[build-system]
# Pinned exactly, and the whole closure of it: an unconstrained `requires`
# resolves whatever is newest at build time, in an isolated environment
# `uv.lock` never sees, so the backend could change what the wheel contains
# with no edit here. Hatchling's own five dependencies float
# (`packaging>=24.2`, `pathspec>=0.10.1`, `pluggy>=1.0.0`, `tomlkit>=0.11.1`,
# `trove-classifiers`), and wheel creation imports four of them, so naming
# only the backend leaves most of the build environment unchosen. They are
# listed here rather than in a `uv build --build-constraints` file because
# this also reaches a consumer building the sdist, which that file does not.
#
# To bump: change the Hatchling pin, re-derive the rest with
#   uv build -v 2>&1 | grep 'Adding transitive dependency'
# and check the wheel still carries common.mk and py.typed. The closure's
# names are asserted in tests/test_supply_chain.py, so a Hatchling release
# that adds or drops a dependency fails there rather than quietly resolving
# it at build time.
requires = [
  "hatchling==1.32.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litmo"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM", "BLE", "RUF"]
# tar-over-zstd-over-file is three layers of stream wrapping; nesting the
# `with`s is how it reads, not an oversight.
ignore = ["SIM117"]
